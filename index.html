<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1220" />
    <title>GPS 지도 연애</title>
  </head>
  <body>
    <div id="map" aria-label="지도"></div>

    <div class="top">
      <header class="topbar">
        <div class="chip" id="src-chip">위치 준비 중…</div>
        <div class="chip" id="near-chip" hidden></div>
        <button class="chip chip-btn" id="list-btn" type="button" aria-label="인연 목록 열기">💌 인연</button>
      </header>

      <form id="search" class="search" role="search" hidden>
        <input id="search-input" type="search" placeholder="장소·주소 검색 (예: 서울역)" enterkeyhint="search" autocomplete="off" aria-label="장소·주소 검색" />
        <button type="submit">검색</button>
      </form>
      <ul id="search-results" class="search-results" hidden></ul>

      <div id="banner" class="banner" role="status" hidden>
        <span id="banner-text"></span>
        <button id="banner-action" type="button" hidden></button>
        <button id="banner-close" type="button" aria-label="닫기">✕</button>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <div id="fx" class="fx" aria-hidden="true"></div>

    <footer class="bottombar">
      <p id="hint" class="hint" hidden></p>
      <div class="actions">
        <button id="follow-btn" type="button" class="active">📍 내 위치</button>
        <button id="roadview-btn" type="button" hidden>🛣️ 로드뷰</button>
        <button id="mode-btn" type="button"></button>
      </div>
    </footer>

    <section id="list" class="sheet" aria-label="인연 목록" hidden>
      <div class="sheet-head">
        <h2>인연</h2>
        <button id="list-close" type="button" aria-label="닫기">✕</button>
      </div>
      <ul id="hero-list" class="heroes"></ul>
      <button id="reset-btn" type="button" class="danger">진행도 초기화</button>
    </section>

    <section id="album" class="sheet" aria-label="앨범" hidden>
      <div class="sheet-head">
        <h2 id="album-title">앨범</h2>
        <button id="album-close" type="button" aria-label="닫기">✕</button>
      </div>
      <div id="album-grid" class="album"></div>
    </section>

    <section id="roadview" class="sheet roadview" aria-label="로드뷰" hidden>
      <div class="sheet-head">
        <h2>로드뷰</h2>
        <button id="roadview-close" type="button" aria-label="닫기">✕</button>
      </div>
      <div id="roadview-view"></div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
